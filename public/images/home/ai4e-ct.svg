<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- 红色箭头标记 -->
    <marker id="redArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c0392b"/>
    </marker>
    <!-- 外圈箭头标记 -->
    <marker id="outerArrow" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#a0c4e8"/>
    </marker>
    <!-- 扇区渐变 -->
    <linearGradient id="sectorGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8f0fe"/>
      <stop offset="100%" stop-color="#dce8f8"/>
    </linearGradient>
  </defs>

  <!-- ===== 外圈循环箭头 ===== -->
  <path d="M 390 62 A 340 340 0 0 1 738 390" fill="none" stroke="#a0c4e8" stroke-width="2.5" marker-end="url(#outerArrow)"/>
  <path d="M 738 410 A 340 340 0 0 1 410 738" fill="none" stroke="#a0c4e8" stroke-width="2.5" marker-end="url(#outerArrow)"/>
  <path d="M 390 738 A 340 340 0 0 1 62 410" fill="none" stroke="#a0c4e8" stroke-width="2.5" marker-end="url(#outerArrow)"/>
  <path d="M 62 390 A 340 340 0 0 1 410 62" fill="none" stroke="#a0c4e8" stroke-width="2.5" marker-end="url(#outerArrow)"/>

  <!-- ===== 四个扇区 ===== -->
  <!-- 左上扇区 PHYSICS -->
  <path d="M 400 80 A 320 320 0 0 0 80 400 L 170 400 A 230 230 0 0 1 400 170 Z" 
        fill="url(#sectorGrad)" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"/>
  <!-- 右上扇区 SCAN -->
  <path d="M 400 80 A 320 320 0 0 1 720 400 L 630 400 A 230 230 0 0 0 400 170 Z" 
        fill="url(#sectorGrad)" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"/>
  <!-- 左下扇区 CLINICAL -->
  <path d="M 80 400 A 320 320 0 0 0 400 720 L 400 630 A 230 230 0 0 1 170 400 Z" 
        fill="url(#sectorGrad)" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"/>
  <!-- 右下扇区 RECON -->
  <path d="M 720 400 A 320 320 0 0 1 400 720 L 400 630 A 230 230 0 0 0 630 400 Z" 
        fill="url(#sectorGrad)" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"/>

  <!-- ===== 十字连接线 ===== -->
  <line x1="400" y1="170" x2="400" y2="80" stroke="#a0c4e8" stroke-width="2"/>
  <line x1="400" y1="630" x2="400" y2="720" stroke="#a0c4e8" stroke-width="2"/>
  <line x1="170" y1="400" x2="80" y2="400" stroke="#a0c4e8" stroke-width="2"/>
  <line x1="630" y1="400" x2="720" y2="400" stroke="#a0c4e8" stroke-width="2"/>

  <!-- ===== 连接节点圆点 ===== -->
  <circle cx="400" cy="125" r="12" fill="#2563eb" stroke="#fff" stroke-width="2"/>
  <circle cx="400" cy="675" r="12" fill="#2563eb" stroke="#fff" stroke-width="2"/>
  <circle cx="125" cy="400" r="12" fill="#2563eb" stroke="#fff" stroke-width="2"/>
  <circle cx="675" cy="400" r="12" fill="#2563eb" stroke="#fff" stroke-width="2"/>

  <!-- ===== 中心六边形 ===== -->
  <polygon points="400,280 490,330 490,430 400,480 310,430 310,330" 
           fill="#ffffff" stroke="#1a3a6b" stroke-width="3.5" stroke-linejoin="round"/>
  <text x="400" y="410" font-family="Arial, Helvetica, sans-serif" font-size="90" 
        font-weight="bold" fill="#2563eb" text-anchor="middle">AI</text>

  <!-- ===== 红色箭头 (从中心指向四个象限) ===== -->
  <line x1="340" y1="340" x2="255" y2="260" stroke="#c0392b" stroke-width="2.5" marker-end="url(#redArrow)"/>
  <line x1="460" y1="340" x2="545" y2="260" stroke="#c0392b" stroke-width="2.5" marker-end="url(#redArrow)"/>
  <line x1="340" y1="420" x2="255" y2="500" stroke="#c0392b" stroke-width="2.5" marker-end="url(#redArrow)"/>
  <line x1="460" y1="420" x2="545" y2="500" stroke="#c0392b" stroke-width="2.5" marker-end="url(#redArrow)"/>

  <!-- ===== 各象限图标 (中心对称布局) ===== -->
  
  <!-- PHYSICS 波形图标 - 左上扇区中心 -->
  <g transform="translate(210, 210)">
    <path d="M 0 15 Q 10 -10 20 15 Q 30 40 40 15 Q 50 -10 60 15 Q 70 40 80 15" 
          fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
    <line x1="-5" y1="15" x2="85" y2="15" stroke="#2563eb" stroke-width="2"/>
  </g>

  <!-- SCAN 人体图标 - 右上扇区中心 -->
  <g transform="translate(555, 205)">
    <rect x="0" y="0" width="50" height="70" rx="5" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    <circle cx="25" cy="18" r="8" fill="none" stroke="#2563eb" stroke-width="2"/>
    <line x1="25" y1="26" x2="25" y2="45" stroke="#2563eb" stroke-width="2"/>
    <line x1="15" y1="33" x2="35" y2="33" stroke="#2563eb" stroke-width="2"/>
    <line x1="25" y1="45" x2="17" y2="60" stroke="#2563eb" stroke-width="2"/>
    <line x1="25" y1="45" x2="33" y2="60" stroke="#2563eb" stroke-width="2"/>
  </g>

  <!-- CLINICAL 心电图+十字图标 - 左下扇区中心 -->
  <g transform="translate(205, 555)">
    <path d="M 0 20 L 15 20 L 20 5 L 30 35 L 38 10 L 43 20 L 58 20" 
          fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="55" y="12" width="16" height="16" rx="2" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    <line x1="63" y1="15" x2="63" y2="25" stroke="#2563eb" stroke-width="2"/>
    <line x1="58" y1="20" x2="68" y2="20" stroke="#2563eb" stroke-width="2"/>
  </g>

  <!-- RECON 网格图标 - 右下扇区中心 -->
  <g transform="translate(550, 550)">
    <rect x="0" y="0" width="14" height="14" fill="#2563eb" rx="1"/>
    <rect x="18" y="0" width="14" height="14" fill="#2563eb" rx="1"/>
    <rect x="36" y="0" width="14" height="14" fill="#2563eb" rx="1"/>
    <rect x="54" y="0" width="14" height="14" fill="#2563eb" rx="1"/>
    <rect x="0" y="18" width="14" height="14" fill="#2563eb" rx="1"/>
    <rect x="18" y="18" width="14" height="14" fill="#2563eb" rx="1"/>
    <rect x="36" y="18" width="14" height="14" fill="#2563eb" rx="1"/>
    <rect x="54" y="18" width="14" height="14" fill="#2563eb" rx="1"/>
    <rect x="0" y="36" width="14" height="14" fill="#2563eb" rx="1"/>
    <rect x="18" y="36" width="14" height="14" fill="#2563eb" rx="1"/>
    <rect x="36" y="36" width="14" height="14" fill="#2563eb" rx="1"/>
    <rect x="54" y="36" width="14" height="14" fill="#2563eb" rx="1"/>
    <rect x="18" y="54" width="14" height="14" fill="#2563eb" rx="1"/>
    <rect x="36" y="54" width="14" height="14" fill="#2563eb" rx="1"/>
    <rect x="54" y="54" width="14" height="14" fill="#2563eb" rx="1"/>
  </g>

  <!-- ===== 文字标签 (水平显示，放在扇区外部) ===== -->
  
  <!-- PHYSICS - 左上方外部 -->
  <text x="180" y="130" font-family="Arial, Helvetica, sans-serif" font-size="24" 
        font-weight="bold" fill="#1a3a6b" text-anchor="middle">PHYSICS</text>

  <!-- SCAN - 右上方外部 -->
  <text x="620" y="130" font-family="Arial, Helvetica, sans-serif" font-size="24" 
        font-weight="bold" fill="#1a3a6b" text-anchor="middle">SCAN</text>

  <!-- CLINICAL - 左下方外部 -->
  <text x="180" y="700" font-family="Arial, Helvetica, sans-serif" font-size="24" 
        font-weight="bold" fill="#1a3a6b" text-anchor="middle">CLINICAL</text>

  <!-- RECON - 右下方外部 -->
  <text x="620" y="700" font-family="Arial, Helvetica, sans-serif" font-size="24" 
        font-weight="bold" fill="#1a3a6b" text-anchor="middle">RECON</text>

</svg>